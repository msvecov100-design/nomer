.num .dg{height:1.25em;overflow:hidden;vertical-align:top;-webkit-mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);color:#d4d4da!important}
.dg i{display:block;font-style:normal;animation:drm .45s linear infinite}@keyframes drm{to{transform:translateY(-12.5em)}}
.val .rb{background:#1a1a1fcc;height:44px;border-radius:14px}.val .rb.ib{width:44px;padding:0;display:grid;place-items:center;font-size:20px}.val b.gr{color:var(--gr)}.val .mu b{font-weight:600;color:#cfcfd6}.val .mu b.gr{color:var(--gr)}
.lkt{color:var(--gr);font-size:13px;margin:16px 0 10px;font-weight:600}
.row .btn.skp{flex:1;background:#17171b;color:#fff;font-size:16px;border:0;border-radius:0;padding:17px;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%)}
/* главный экран по скриншоту: сверху от лиги до SIM 66px, от SIM до «Удачи» 132px */
.sim.rl{margin:66px 0 0}
#v .val{margin-top:16px}.val[hidden]{display:none}
.sim.rl~.luck,.sim.rl~.lkt{margin-top:132px}
.sim.rl~.val:not([hidden])~.luck,.sim.rl~.val:not([hidden])~.lkt{margin-top:66px}
/* цифры оценки на одном уровне с кнопками «Продать» и т.д. */
.val{align-items:center}
.zdual{align-items:center}.zdual>div{position:relative}
.zdual .n{line-height:40px;height:40px;font-size:20px!important}
.zdual>div>.mu{position:absolute;left:0;top:-8px;line-height:1}
.val{gap:4px}.zdual{gap:10px}
.val .rb{padding:0 9px;font-size:13px;height:40px}.val .rb.ib{width:40px;height:40px}
.val .s{gap:4px}
#v .val{flex-wrap:nowrap!important;row-gap:0!important}.val>div:first-child{min-width:0}
.zdual>div:first-child{min-width:64px}.zdual .g{display:none}
